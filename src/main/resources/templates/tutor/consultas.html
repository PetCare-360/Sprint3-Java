<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Consultas')}"></head>
<body>
	<header th:replace="~{fragmentos :: topbar}"></header>
	<nav th:replace="~{fragmentos :: navTutor}"></nav>

	<main>
		<h1>Consultas</h1>
		<form method="get" th:action="@{/tutor/consultas}">
			<label for="status">Filtrar por status</label>
			<select id="status" name="status">
				<option value="" th:selected="${selectedStatus == null || selectedStatus == ''}">Todos</option>
				<option value="REQUESTED" th:selected="${selectedStatus == 'REQUESTED'}">Solicitada</option>
				<option value="CONFIRMED" th:selected="${selectedStatus == 'CONFIRMED'}">Confirmada</option>
				<option value="CANCELED" th:selected="${selectedStatus == 'CANCELED'}">Cancelada</option>
				<option value="DONE" th:selected="${selectedStatus == 'DONE'}">Concluída</option>
			</select>
			<button type="submit">Filtrar</button>
		</form>

		<p th:if="${#lists.isEmpty(linkedVeterinarians)}">Conecte um veterinário ao pet antes de solicitar consulta.</p>

		<form th:action="@{/appointments/form}" method="post" th:if="${!#lists.isEmpty(linkedVeterinarians)}">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<p>
				<label for="appointmentKey">Pet e veterinário</label><br>
				<select id="appointmentKey" name="appointmentKey" required>
					<option value="">Selecione</option>
					<option th:each="link : ${linkedVeterinarians}"
							th:value="${link.pet.id} + ':' + ${link.veterinarian.id}"
							th:text="${link.pet.name} + ' com ' + ${link.veterinarian.name}"></option>
				</select>
			</p>
			<p><input type="datetime-local" name="scheduledAt" required></p>
			<p><input type="text" name="reason" placeholder="Motivo" maxlength="255" required></p>
			<button type="submit">Solicitar consulta</button>
		</form>

		<h2>Minhas consultas</h2>
		<p th:if="${#lists.isEmpty(appointments)}">Nenhuma consulta.</p>
		<table border="1" cellpadding="6" th:if="${!#lists.isEmpty(appointments)}">
			<thead>
				<tr>
					<th>Pet</th>
					<th>Veterinário</th>
					<th>Data</th>
					<th>Status</th>
					<th>Motivo</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${appointments}">
					<td th:text="${item.petName()}"></td>
					<td th:text="${item.veterinarianName()}"></td>
					<td th:text="${item.scheduledAt()}"></td>
					<td th:text="${item.status()}"></td>
					<td th:text="${item.reason()}"></td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
