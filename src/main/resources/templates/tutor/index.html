<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Tutor')}"></head>
<body>
	<header th:replace="~{fragmentos :: topbar}"></header>
	<nav th:replace="~{fragmentos :: navTutor}"></nav>

	<main>
		<h1>Painel do tutor</h1>
		<p>Resumo da sua área.</p>

		<table border="1" cellpadding="6">
			<thead>
				<tr>
					<th>Pets</th>
					<th>Veterinários vinculados</th>
					<th>Mensagens</th>
					<th>Consultas</th>
					<th>Recomendações</th>
					<th>Alertas</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td th:text="${petCount}"></td>
					<td th:text="${linkCount}"></td>
					<td th:text="${messageCount}"></td>
					<td th:text="${appointmentCount}"></td>
					<td th:text="${recommendationCount}"></td>
					<td th:text="${alertCount}"></td>
				</tr>
			</tbody>
		</table>

		<h2>Ações rápidas</h2>
		<ul>
			<li><a th:href="@{/tutor/pets}">Ver meus pets</a></li>
			<li><a th:href="@{/tutor/pets/novo}">Cadastrar novo pet</a></li>
			<li><a th:href="@{/tutor/veterinarios}">Conectar pet com veterinário</a></li>
			<li><a th:href="@{/tutor/mensagens}">Enviar e ler mensagens</a></li>
			<li><a th:href="@{/tutor/consultas}">Solicitar e ver consultas</a></li>
			<li><a th:href="@{/tutor/recomendacoes}">Ver recomendações recebidas</a></li>
		</ul>
	</main>
</body>
</html>
