<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Veterinários')}"></head>
<body>
	<header th:replace="~{fragmentos :: topbar}"></header>
	<nav th:replace="~{fragmentos :: navTutor}"></nav>

	<main>
		<h1>Veterinários</h1>
		<p>Conecte um pet a um veterinário para liberar mensagens, consultas e recomendações.</p>

		<form th:action="@{/veterinarians/link/form}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<p>
				<label for="linkPet">Pet</label><br>
				<select id="linkPet" name="petId" required>
					<option value="">Selecione</option>
					<option th:each="pet : ${pets}" th:value="${pet.id()}" th:text="${pet.name()} + ' - ' + ${pet.species()}"></option>
				</select>
			</p>
			<p>
				<label for="linkVet">Veterinário</label><br>
				<select id="linkVet" name="veterinarianId" required>
					<option value="">Selecione</option>
					<option th:each="vet : ${veterinarians}" th:value="${vet.id}" th:text="${vet.name} + ' - ' + ${vet.email}"></option>
				</select>
			</p>
			<button type="submit">Conectar veterinário</button>
		</form>

		<h2>Conexões ativas</h2>
		<p th:if="${#lists.isEmpty(linkedVeterinarians)}">Nenhum veterinário vinculado.</p>
		<table border="1" cellpadding="6" th:if="${!#lists.isEmpty(linkedVeterinarians)}">
			<thead>
				<tr>
					<th>Pet</th>
					<th>Veterinário</th>
					<th>Data</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="link : ${linkedVeterinarians}">
					<td th:text="${link.pet.name}"></td>
					<td th:text="${link.veterinarian.name} + ' - ' + ${link.veterinarian.email}"></td>
					<td th:text="${link.assignedAt}"></td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
