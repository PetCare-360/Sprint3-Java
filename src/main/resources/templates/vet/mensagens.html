<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Mensagens do veterinário')}"></head>
<body>
	<header th:replace="~{fragmentos :: topbar}"></header>
	<nav th:replace="~{fragmentos :: navVet}"></nav>

	<main>
		<h1>Mensagens</h1>
		<p th:if="${#lists.isEmpty(linkedPets)}">Nenhum pet vinculado para responder.</p>

		<form th:action="@{/messages/form}" method="post" th:if="${!#lists.isEmpty(linkedPets)}">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<p>
				<label for="conversationKey">Pet e tutor</label><br>
				<select id="conversationKey" name="conversationKey" required>
					<option value="">Selecione</option>
					<option th:each="link : ${linkedPets}"
							th:value="${link.pet.id} + ':' + ${link.pet.user.id}"
							th:text="${link.pet.name} + ' - tutor ' + ${link.pet.user.name}"></option>
				</select>
			</p>
			<p><input type="text" name="subject" placeholder="Assunto" maxlength="120" required></p>
			<p><textarea name="message" placeholder="Mensagem" maxlength="1000" required></textarea></p>
			<button type="submit">Responder tutor</button>
		</form>

		<h2>Histórico</h2>
		<p th:if="${#lists.isEmpty(messages)}">Nenhuma mensagem.</p>
		<table border="1" cellpadding="6" th:if="${!#lists.isEmpty(messages)}">
			<thead>
				<tr>
					<th>Pet</th>
					<th>De/Para</th>
					<th>Assunto</th>
					<th>Mensagem</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${messages}">
					<td th:text="${item.petName()}"></td>
					<td th:text="${item.senderName()} + ' para ' + ${item.receiverName()}"></td>
					<td th:text="${item.subject()}"></td>
					<td th:text="${item.message()}"></td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
