<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Recomendações do veterinário')}"></head>
<body>
	<header th:replace="~{fragmentos :: topbar}"></header>
	<nav th:replace="~{fragmentos :: navVet}"></nav>

	<main>
		<h1>Recomendações</h1>
		<form th:action="@{/recommendations/form}" method="post" th:if="${!#lists.isEmpty(linkedPets)}">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<p>
				<label for="petId">Pet vinculado</label><br>
				<select id="petId" name="petId" required>
					<option value="">Selecione</option>
					<option th:each="link : ${linkedPets}" th:value="${link.pet.id}"
							th:text="${link.pet.name} + ' - tutor ' + ${link.pet.user.name}"></option>
				</select>
			</p>
			<p><input type="text" name="title" placeholder="Título" maxlength="120" required></p>
			<p>
				<select name="priority" required>
					<option value="LOW">Baixa</option>
					<option value="NORMAL" selected>Normal</option>
					<option value="HIGH">Alta</option>
				</select>
			</p>
			<p><textarea name="instructions" placeholder="Orientações" maxlength="1000" required></textarea></p>
			<button type="submit">Enviar recomendação</button>
		</form>

		<h2>Enviadas</h2>
		<p th:if="${#lists.isEmpty(recommendations)}">Nenhuma recomendação.</p>
		<table border="1" cellpadding="6" th:if="${!#lists.isEmpty(recommendations)}">
			<thead>
				<tr>
					<th>Pet</th>
					<th>Tutor</th>
					<th>Título</th>
					<th>Prioridade</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${recommendations}">
					<td th:text="${item.petName()}"></td>
					<td th:text="${item.tutorName()}"></td>
					<td th:text="${item.title()}"></td>
					<td th:text="${item.priority()}"></td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
