<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Cadastro')}"></head>
<body class="auth-page">
	<main class="login-panel">
		<h1>Criar conta</h1>
		<p>Escolha se a conta será de tutor ou veterinário.</p>

		<form th:action="@{/register}" method="post" class="form-stack">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<label>
				Nome
				<input type="text" name="name" required maxlength="120">
			</label>
			<label>
				E-mail
				<input type="email" name="email" required maxlength="160" autocomplete="username">
			</label>
			<label>
				Senha
				<input type="password" name="password" required minlength="6" maxlength="80" autocomplete="new-password">
			</label>
			<label>
				Tipo de conta
				<select name="role" required>
					<option value="ROLE_CLIENTE">Tutor</option>
					<option value="ROLE_VETERINARIO">Veterinário</option>
				</select>
			</label>
			<button type="submit">Cadastrar</button>
		</form>

		<p><a th:href="@{/login}">Voltar para login</a></p>
	</main>
</body>
</html>
