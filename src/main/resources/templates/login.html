<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Login')}"></head>
<body class="auth-page">
	<main class="login-panel">
		<h1>PetCare360</h1>
		<p>Entre para acompanhar pets, alertas e atendimento veterinário.</p>

		<form th:action="@{/login}" method="post" class="form-stack">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<label>
				E-mail
				<input type="email" name="username" required autocomplete="username">
			</label>
			<label>
				Senha
				<input type="password" name="password" required autocomplete="current-password">
			</label>
			<button type="submit">Entrar</button>
		</form>

		<p class="feedback" th:if="${param.error}">E-mail ou senha inválidos.</p>
		<p class="feedback" th:if="${param.logout}">Sessão encerrada.</p>
		<p class="feedback" th:if="${param.registered}">Conta criada. Faça login para continuar.</p>
		<p><a th:href="@{/register}">Criar conta como tutor ou veterinário</a></p>
	</main>
</body>
</html>
