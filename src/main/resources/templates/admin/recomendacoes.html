<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('PetCare360 - Recomendações')}"></head>
<body>
	<header th:replace="~{fragmentos :: topbar}"></header>
	<nav th:replace="~{fragmentos :: navAdmin}"></nav>

	<main>
		<h1>Recomendações</h1>
		<form th:action="@{/recommendations/form}" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<p>
				<label for="adminPetRecommendation">Pet</label><br>
				<select id="adminPetRecommendation" name="petId" required>
					<option value="">Selecione</option>
					<option th:each="pet : ${pets}" th:value="${pet.id}"
							th:text="${pet.name} + ' - tutor ' + ${pet.user.name}"></option>
				</select>
			</p>
			<p><input type="text" name="title" placeholder="Título" maxlength="120" required></p>
			<p>
				<select name="priority" required>
					<option value="LOW">Baixa</option>
					<option value="NORMAL" selected>Normal</option>
					<option value="HIGH">Alta</option>
				</select>
			</p>
			<p><textarea name="instructions" placeholder="Orientações" maxlength="1000" required></textarea></p>
			<button type="submit">Enviar recomendação</button>
		</form>

		<h2>Histórico geral</h2>
		<p th:if="${#lists.isEmpty(recommendations)}">Nenhuma recomendação.</p>
		<table border="1" cellpadding="6" th:if="${!#lists.isEmpty(recommendations)}">
			<thead>
				<tr>
					<th>Pet</th>
					<th>Tutor</th>
					<th>Veterinário</th>
					<th>Título</th>
					<th>Prioridade</th>
					<th>Orientação</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="item : ${recommendations}">
					<td th:text="${item.petName()}"></td>
					<td th:text="${item.tutorName()}"></td>
					<td th:text="${item.veterinarianName()}"></td>
					<td th:text="${item.title()}"></td>
					<td th:text="${item.priority()}"></td>
					<td th:text="${item.instructions()}"></td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
